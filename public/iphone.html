<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burrito Fly · iPhone</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  body {
    background: radial-gradient(circle at 50% 35%, #ffffff 0%, #eef0f4 45%, #dfe3ea 100%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }

  /* iPhone 15 Pro: pantalla 393 × 852 + borde de 14 px = 421 × 880 */
  .iphone {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 421px;
    height: 880px;
    transform: translate(-50%, -50%) scale(var(--s, 1));
    transform-origin: center center;
  }
  .marco {
    position: absolute;
    inset: 0;
    box-sizing: border-box;
    border: 14px solid #0b0b0c;
    border-radius: 68px;
    background: #0b0b0c;
    box-shadow:
      0 0 0 2px #3a3a3e,
      0 0 0 4px #1c1c1e,
      0 40px 80px -20px rgba(20, 24, 40, 0.45),
      0 18px 36px -18px rgba(20, 24, 40, 0.35);
  }

  /* Botones laterales */
  .boton {
    position: absolute;
    width: 4px;
    background: #2a2a2d;
    border-radius: 2px;
  }
  .boton.accion { left: -6px; top: 160px; height: 32px; }
  .boton.vol-arriba { left: -6px; top: 222px; height: 62px; }
  .boton.vol-abajo { left: -6px; top: 298px; height: 62px; }
  .boton.encendido { right: -6px; top: 250px; height: 100px; }

  .pantalla {
    position: absolute;
    top: 14px;
    left: 14px;
    width: 393px;
    height: 852px;
    border-radius: 54px;
    overflow: hidden;
    background: #fceba6;
    isolation: isolate;
  }

  /* Barra de estado */
  .barra-estado {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 30px 0 46px;
    box-sizing: border-box;
    background: #fceba6;
    color: #000;
    z-index: 2;
  }
  .hora {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .iconos {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .isla {
    position: absolute;
    top: 11px;
    left: 50%;
    width: 125px;
    height: 37px;
    transform: translateX(-50%);
    border-radius: 20px;
    background: #000;
    z-index: 3;
  }

  /* La app, en vivo. Ancho extra para esconder la barra de scroll de escritorio. */
  .app {
    position: absolute;
    top: 54px;
    left: 0;
    width: calc(100% + 15px);
    height: calc(100% - 54px);
    border: 0;
    display: block;
    background: #f5f5f3;
    z-index: 1;
  }

  .barra-inicio {
    position: absolute;
    bottom: 8px;
    left: 50%;
    width: 134px;
    height: 5px;
    transform: translateX(-50%);
    border-radius: 3px;
    background: #000;
    opacity: 0.85;
    pointer-events: none;
    z-index: 3;
  }
</style>
</head>
<body>
  <div class="iphone" id="iphone">
    <span class="boton accion" aria-hidden="true"></span>
    <span class="boton vol-arriba" aria-hidden="true"></span>
    <span class="boton vol-abajo" aria-hidden="true"></span>
    <span class="boton encendido" aria-hidden="true"></span>

    <div class="marco" aria-hidden="true"></div>

    <div class="pantalla">
      <div class="barra-estado">
        <span class="hora">9:41</span>
        <span class="iconos" aria-hidden="true">
          <!-- Señal -->
          <svg width="18" height="12" viewBox="0 0 18 12" fill="#000">
            <rect x="0" y="8" width="3" height="4" rx="1"></rect>
            <rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect>
            <rect x="10" y="3" width="3" height="9" rx="1"></rect>
            <rect x="15" y="0" width="3" height="12" rx="1"></rect>
          </svg>
          <!-- Wi-Fi -->
          <svg width="17" height="12" viewBox="0 0 17 12" fill="#000">
            <path d="M8.5 2.4c2.3 0 4.4.9 6 2.4l1.2-1.2C13.8 1.7 11.3.7 8.5.7S3.2 1.7 1.3 3.6l1.2 1.2c1.6-1.5 3.7-2.4 6-2.4z"></path>
            <path d="M8.5 5.8c1.4 0 2.6.5 3.6 1.4l1.2-1.2C12 4.8 10.3 4.1 8.5 4.1S5 4.8 3.7 6l1.2 1.2c1-.9 2.2-1.4 3.6-1.4z"></path>
            <path d="M8.5 9.2c.5 0 .9.2 1.2.5L8.5 11 7.3 9.7c.3-.3.7-.5 1.2-.5z"></path>
            <path d="M8.5 7.5c.9 0 1.7.3 2.4.9l-1.2 1.2c-.3-.3-.7-.4-1.2-.4s-.9.1-1.2.4L6.1 8.4c.7-.6 1.5-.9 2.4-.9z"></path>
          </svg>
          <!-- Batería -->
          <svg width="27" height="13" viewBox="0 0 27 13" fill="none">
            <rect x="0.5" y="0.5" width="23" height="12" rx="3.8" stroke="#000" stroke-opacity="0.4"></rect>
            <rect x="2" y="2" width="20" height="9" rx="2.5" fill="#000"></rect>
            <path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" fill="#000" fill-opacity="0.45"></path>
          </svg>
        </span>
      </div>

      <div class="isla" aria-hidden="true"></div>

      <iframe class="app" src="/" title="Menú de Burrito Fly"></iframe>

      <div class="barra-inicio" aria-hidden="true"></div>
    </div>
  </div>

  <script>
    // Escala el iPhone para que quepa completo en la ventana (nunca más grande que su tamaño real).
    (function () {
      var telefono = document.getElementById("iphone");
      var ANCHO = 421 + 12; // marco + botones laterales
      var ALTO = 880;
      var MARGEN = 48;
      function ajustar() {
        var s = Math.min(
          (window.innerWidth - MARGEN) / ANCHO,
          (window.innerHeight - MARGEN) / ALTO,
          1
        );
        telefono.style.setProperty("--s", Math.max(s, 0.1).toFixed(4));
      }
      ajustar();
      window.addEventListener("resize", ajustar);
    })();
  </script>
</body>
</html>
